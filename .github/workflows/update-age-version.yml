name: Update Version

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate age version
        id: age
        shell: python
        run: |
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          import calendar

          DOB = date(2000, 11, 10)
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()

          def add_months(d, months):
              total = d.year * 12 + (d.month - 1) + months
              year = total // 12
              month = total % 12 + 1
              day = min(d.day, calendar.monthrange(year, month)[1])
              return date(year, month, day)

          # Full years completed on the birthday.
          years = today.year - DOB.year
          birthday = date(today.year, DOB.month, DOB.day)
          if today < birthday:
              years -= 1

          # Start from the most recent birthday.
          birthday = date(DOB.year + years, DOB.month, DOB.day)

          # Full monthly anniversaries completed since that birthday.
          months = (today.year - birthday.year) * 12 + (today.month - birthday.month)
          month_anchor = add_months(birthday, months)

          if today < month_anchor:
              months -= 1
              month_anchor = add_months(birthday, months)

          # Patch is 1-indexed: the anniversary date itself is .1.
          days = (today - month_anchor).days + 1

          version = f"{years}.{months}.{days}"
          print(f"Age version: {version}")

          with open("/tmp/age-version", "w") as f:
              f.write(version)

      - name: Update README
        shell: bash
        run: |
          VERSION="$(cat /tmp/age-version)"
          python - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          path = Path("README.md")
          text = path.read_text()

          pattern = r"(<!-- AGE-VERSION:START -->\n)\*\*v[^*]+\*\*(\n<!-- AGE-VERSION:END -->)"
          replacement = rf"\g<1>**v{version}**\2"

          updated, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              raise SystemExit("AGE-VERSION markers not found exactly once")

          path.write_text(updated)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "Age version is already current."
            exit 0
          fi

          git add README.md
          git commit -m "chore: update version"
          git push
